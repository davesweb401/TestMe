<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Testing Center Booking Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        a.button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            background-color: #005a9e;
            color: #ffffff;
        }
        a.button:hover {
            background-color: #004578;
        }
        .logout {
            background-color: #a80000;
        }
        .logout:hover {
            background-color: #7a0000;
        }
    </style>

    <script>
        // ⭐ Detect if user returned after login
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get("afterLogin") === "1") {
                // Launch Canvas app ONLY after login is complete
                window.location.href =
                    "https://apps.powerapps.com/play/e/2c16c55f-029e-eab6-a895-cf758abc090e/a/d88cfdfe-c1d7-464c-ad73-3e18c784ad47";
            }
        };

        // ⭐ Login in same tab, then return to this page with flag
        function loginThenLaunch() {
            const returnUrl = encodeURIComponent(window.location.origin + window.location.pathname + "?afterLogin=1");

            // myVCCCD login with return URL pointing back to THIS page
            window.location.href =
                "https://account.vcccd.edu/_layouts/PG/login.aspx?ReturnUrl=" + returnUrl;
        }

        // ⭐ Logout + guaranteed redirect
        function logoutAndRedirect() {
            window.open("https://login.microsoftonline.com/common/oauth2/logout", "_blank");

            setTimeout(function() {
                window.location.href = "https://davesweb401.github.io/TestMe/redirect.html";
            }, 1200);
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Testing Center Booking</h1>

        <p><strong>Step 1:</strong> Log in to myVCCCD.</p>
        <a href="javascript:void(0);" class="button" onclick="loginThenLaunch()">
            Log In and Open Booking App
        </a>

        <hr style="margin: 2rem 0;">

        <h2>Finished Booking?</h2>
        <a href="javascript:void(0);" class="button logout" onclick="logoutAndRedirect()">
            Log Out and Return
        </a>
    </div>
</body>
</html>
